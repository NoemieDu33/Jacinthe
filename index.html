<!DOCTYPE html>
<html>

<head>
<meta name="viewport" content="width=device-width, initial-scale=1">

<style>
body {
    margin: 0;
    background: #111;
    overflow: hidden;
    touch-action: none;
    display: flex;
    justify-content: center;
    align-items: center;
    height: 100vh;
    font-family: Arial;
}

#controls {
    display: grid;
    grid-template-columns: 120px 120px 120px;
    grid-template-rows: 120px 120px 120px;
    gap: 20px;
}

button {
    border: none;
    border-radius: 20px;
    background: #333;
    color: white;
    font-size: 24px;
    font-weight: bold;
}

button:active {
    background: #666;
}

#up {
    grid-column: 2;
    grid-row: 1;
}

#left {
    grid-column: 1;
    grid-row: 2;
}

#right {
    grid-column: 3;
    grid-row: 2;
}

#down {
    grid-column: 2;
    grid-row: 3;
}

#debug {
    position: absolute;
    top: 20px;
    left: 20px;
    color: white;
    font-size: 20px;
}
</style>
</head>

<body>

<div id="debug">
DIRECTION: NONE
</div>

<div id="controls">
    <button id="up">U</button>
    <button id="left">L</button>
    <button id="right"R</button>
    <button id="down">D</button>
</div>

<script>

const debug = document.getElementById("debug");

let currentDir = "NONE";

function send(dir) {
    fetch("/move?dir=" + dir)
        .catch(err => console.log(err));
}

function updateDebug() {
    debug.innerHTML = "DIRECTION: " + currentDir;
}

function setDirection(dir) {

    if (currentDir !== dir) {
        currentDir = dir;
        updateDebug();
        console.log("SEND:", dir);
    }
}

function stopDirection() {

    currentDir = "NONE";
    updateDebug();

    console.log("SEND: NONE");
}

function bindButton(id, dir) {

    const btn = document.getElementById(id);

    // MOBILE
    btn.addEventListener("touchstart", (e) => {
        e.preventDefault();
        setDirection(dir);
    });

    btn.addEventListener("touchend", (e) => {
        e.preventDefault();
        stopDirection();
    });

    // PC
    btn.addEventListener("mousedown", (e) => {
        e.preventDefault();
        setDirection(dir);
    });

    btn.addEventListener("mouseup", (e) => {
        e.preventDefault();
        stopDirection();
    });
}

bindButton("up", "UP");
bindButton("down", "DOWN");
bindButton("left", "LEFT");
bindButton("right", "RIGHT");

// envoi périodique
setInterval(() => {
    send(currentDir);
}, 200);

updateDebug();

</script>


</body>
</html>
