<!DOCTYPE html>
<html>

<head>
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>

body {
    margin: 0;
    background: #111;
    overflow: hidden;
    touch-action: none;
}

#base {
    position: absolute;
    width: 240px;
    height: 240px;
    background: #333;
    border-radius: 50%;
    left: 50%;
    top: 50%;
    transform: translate(-50%, -50%);
}

#stick {
    position: absolute;
    width: 100px;
    height: 100px;
    background: white;
    border-radius: 50%;
    left: 70px;
    top: 70px;
}
#debug {
    position: absolute;
    top: 20px;
    left: 20px;
    color: white;
    font-family: Arial;
    font-size: 20px;
}
</style>
</head>

<body>
<div id="debug">
X: 0.00<br>
Y: 0.00
</div>
<div id="base">
    <div id="stick"></div>
</div>

<script>

const base = document.getElementById("base");
const stick = document.getElementById("stick");
const debug = document.getElementById("debug");

let dragging = false;
let lastSend = 0;

// smoothing
let fx = 0;
let fy = 0;
let currentX = 0;
let currentY = 0;

function clamp(v, min, max) {
    return Math.max(min, Math.min(max, v));
}

function send(x, y) {
    fetch(`/move?x=${x}&y=${y}`);
}

function update(clientX, clientY) {

    const rect = base.getBoundingClientRect();

    const cx = rect.left + rect.width / 2;
    const cy = rect.top + rect.height / 2;

    let dx = clientX - cx;
    let dy = clientY - cy;

    const max = 90;

    const dist = Math.sqrt(dx*dx + dy*dy);

    if (dist > max) {
        dx = dx / dist * max;
        dy = dy / dist * max;
    }

    // move stick visually
    stick.style.left = (dx + 70) + "px";
    stick.style.top  = (dy + 70) + "px";

    let x = dx / max;
    let y = -dy / max;

    // DEADZONE
    const dead = 0.12;
    if (Math.abs(x) < dead) x = 0;
    if (Math.abs(y) < dead) y = 0;

    // SMOOTHING
    fx = fx * 0.7 + x * 0.3;
    fy = fy * 0.7 + y * 0.3;

    fx = clamp(fx, -1, 1);
    fy = clamp(fy, -1, 1);


    currentX = fx.toFixed(2);
    currentY = fy.toFixed(2);

    // DEBUG DISPLAY
    debug.innerHTML =
        "X: " + fx.toFixed(2) + "<br>" +
        "Y: " + fy.toFixed(2);
}

// START
function start(e) {
    dragging = true;
}

// MOVE
function move(e) {
    if (!dragging) return;

    const t = e.touches[0];
    update(t.clientX, t.clientY);
}

// STOP (IMPORTANT FIX)
function stop() {
    dragging = false;

    // reset visual stick
    stick.style.left = "70px";
    stick.style.top  = "70px";

    // reset values
    fx = 0;
    fy = 0;
    currentX = 0;
    currentY = 0;

    send(0, 0);

    debug.innerHTML =
        "X: 0.00<br>Y: 0.00";
}

// EVENTS (FIX IMPORTANT)
base.addEventListener("touchstart", start);
base.addEventListener("touchmove", move);

document.addEventListener("touchend", stop);
document.addEventListener("touchcancel", stop);

// OPTIONAL: mouse support (PC)
base.addEventListener("mousedown", start);

document.addEventListener("mousemove", (e) => {
    if (!dragging) return;
    update(e.clientX, e.clientY);
});

document.addEventListener("mouseup", stop);

setInterval(() => {
    send(currentX, currentY);
}, 100);

</script>

</body>
</html>
